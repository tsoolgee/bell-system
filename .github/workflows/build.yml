name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    # פלט הבדיקות בעברית, והקונסולה של הראנר היא cp1252
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Tag must match bells/version.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "from bells.version import VERSION; print(VERSION)")
          echo "tag=$tag version=$ver"
          test "$tag" = "$ver" || { echo "::error::tag $tag does not match VERSION $ver"; exit 1; }

      - name: Run tests
        run: |
          python tests/t_engine.py
          python tests/t_audio.py
          python tests/t_tts.py
          python tests/t_tray_restart.py
          python tests/t_upgrade.py
          python tests/t_multiuser.py
          python tests/t_update.py
          python tests/t_wake.py
          python tests/t_elevate.py

      - name: Build EXE
        run: python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: BellSystem
          path: dist/BellSystem.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BellSystem.exe
          generate_release_notes: true
